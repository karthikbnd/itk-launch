<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a2b">
  <title>ITK e.V. Website Launch</title>

  <style>
    :root {
      --navy: #071a2b;
      --navy-light: #0d3c61;
      --gold: #f5b942;
      --white: #ffffff;
      --cyan: #79ddec;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 50% 48%, #15527c 0%, var(--navy-light) 27%, var(--navy) 72%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.17;
      background: repeating-radial-gradient(
        circle at center,
        transparent 0 70px,
        rgba(245, 185, 66, 0.35) 72px 74px
      );
    }

    .stage {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: max(16px, env(safe-area-inset-top))
               max(24px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom))
               max(24px, env(safe-area-inset-left));
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 190px;
      width: 100%;
      text-align: center;
    }

    .logo {
      display: block;
      width: auto;
      height: auto;
      max-width: min(360px, 45vw);
      max-height: 180px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 7px 16px rgba(0, 0, 0, 0.38));
    }

    main {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .panel {
      width: min(1100px, 94vw);
      padding: 18px;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: clamp(17px, 2.1vw, 30px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(42px, 7vw, 92px);
      line-height: 1.02;
      text-shadow: 0 5px 22px rgba(0, 0, 0, 0.35);
    }

    .subtitle {
      margin: 0 0 42px;
      color: #d8e8f4;
      font-size: clamp(19px, 2.6vw, 34px);
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 22px 54px;
      background: linear-gradient(180deg, #ffd36c, var(--gold));
      color: var(--navy);
      font-size: clamp(23px, 3vw, 38px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 34px rgba(245, 185, 66, 0.48), 0 12px 30px rgba(0, 0, 0, 0.33);
      touch-action: manipulation;
    }

    button:active { transform: scale(0.98); }

    #countdown {
      display: none;
      color: var(--gold);
      font-size: clamp(150px, 32vw, 360px);
      font-weight: 900;
      line-height: 0.9;
      text-shadow: 0 0 48px rgba(245, 185, 66, 0.4);
    }

    #success {
      display: none;
      animation: rise 0.7s ease both;
    }

    #live {
      color: var(--gold);
      font-size: clamp(54px, 10vw, 130px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 40px rgba(245, 185, 66, 0.4);
    }

    #message {
      margin: 28px auto 34px;
      max-width: 1000px;
      font-size: clamp(22px, 3vw, 40px);
      line-height: 1.35;
    }

    #openWebsiteBtn {
      font-size: clamp(19px, 2.2vw, 30px);
      padding: 17px 38px;
    }

    footer {
      text-align: center;
      color: #9eb7c8;
      font-size: clamp(12px, 1.4vw, 18px);
    }

    #confetti {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(25px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 700px) {
      header { min-height: 145px; }
      .logo { max-width: min(260px, 58vw); max-height: 135px; }
      .panel { padding: 8px; }
      .subtitle { margin-bottom: 30px; }
    }

    @media (orientation: landscape) and (max-height: 650px) {
      header { min-height: 110px; }
      .logo { max-height: 100px; max-width: 220px; }
      h1 { font-size: clamp(36px, 6vw, 66px); }
      .subtitle { margin-bottom: 22px; }
    }
  </style>
</head>

    <main>
      <section class="panel" id="intro">
        <div class="eyebrow">A New Digital Milestone</div>
        <h1>ITK e.V. Website Launch</h1>
        <p class="subtitle">Celebrating community, culture and connection</p>
        <button id="launchBtn" type="button">LAUNCH WEBSITE</button>
      </section>

      <div id="countdown" aria-live="assertive"></div>

      <section class="panel" id="success" aria-live="polite">
        <div id="live">WE ARE LIVE!</div>
        <div id="message">
          The ITK e.V. website is now live.<br>
          Thank you for being part of this milestone.
        </div>
        <button id="openWebsiteBtn" type="button">OPEN ITK WEBSITE</button>
      </section>
    </main>

    <footer>Tap “Open ITK Website” only after the launch message.</footer>
  </div>

  <script>
    "use strict";

    const WEBSITE_URL = "https://itk-ev.de";

    const launchBtn = document.getElementById("launchBtn");
    const openWebsiteBtn = document.getElementById("openWebsiteBtn");
    const intro = document.getElementById("intro");
    const countdown = document.getElementById("countdown");
    const success = document.getElementById("success");

    let launchStarted = false;

    function playTone(frequency, start, duration, audioContext) {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function playLaunchSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContextClass();
        const now = audioContext.currentTime;

        [523.25, 659.25, 783.99, 1046.5].forEach((note, index) => {
          playTone(note, now + index * 0.18, 0.32, audioContext);
        });
      } catch (error) {
        console.log("Audio is unavailable:", error);
      }
    }

    function runConfetti(durationMs = 6500) {
      const canvas = document.getElementById("confetti");
      const context = canvas.getContext("2d");
      const colors = ["#f5b942", "#ffffff", "#79ddec", "#ff6b81", "#73e074", "#9e7cff"];
      const pieces = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        context.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      }

      resizeCanvas();

      for (let index = 0; index < 280; index++) {
        pieces.push({
          x: Math.random() * window.innerWidth,
          y: -Math.random() * window.innerHeight * 0.7,
          width: 5 + Math.random() * 10,
          height: 3 + Math.random() * 6,
          velocityX: -2.5 + Math.random() * 5,
          velocityY: 4 + Math.random() * 7,
          rotation: Math.random() * Math.PI,
          rotationVelocity: -0.18 + Math.random() * 0.36,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      const startTime = performance.now();

      function animate(currentTime) {
        context.clearRect(0, 0, window.innerWidth, window.innerHeight);

        pieces.forEach((piece) => {
          piece.x += piece.velocityX + Math.sin(piece.rotation) * 0.8;
          piece.y += piece.velocityY;
          piece.rotation += piece.rotationVelocity;

          context.save();
          context.translate(piece.x, piece.y);
          context.rotate(piece.rotation);
          context.fillStyle = piece.color;
          context.fillRect(
            -piece.width / 2,
            -piece.height / 2,
            piece.width,
            piece.height
          );
          context.restore();
        });

        if (currentTime - startTime < durationMs) {
          requestAnimationFrame(animate);
        } else {
          context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }

      requestAnimationFrame(animate);
    }

    launchBtn.addEventListener("click", async () => {
      if (launchStarted) return;
      launchStarted = true;

      try {
        const page = document.documentElement;
        if (page.requestFullscreen) {
          await page.requestFullscreen();
        } else if (page.webkitRequestFullscreen) {
          page.webkitRequestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen is not available:", error);
      }

      intro.style.display = "none";
      countdown.style.display = "block";

      let number = 5;
      countdown.textContent = number;

      const timer = setInterval(() => {
        number -= 1;

        if (number > 0) {
          countdown.textContent = number;
          return;
        }

        clearInterval(timer);
        countdown.style.display = "none";
        success.style.display = "block";

        playLaunchSound();
        runConfetti();

        // No automatic redirect and no automatic new tab.
      }, 1000);
    });

    openWebsiteBtn.addEventListener("click", () => {
      // The website opens only after this separate tap.
      window.location.assign(WEBSITE_URL);
    });
  </script>
